[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "way00out", email = "way00out@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.23",
    "dotenv>=0.9.9",
    "fastmcp>=4.0.11",
    "langchain[mcp]>=1.4.3",
    "langchain-openai>=1.6.7",
    "markitdown[all]>=0.1.8",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.14",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
